# Builds the Android app so it can be downloaded and installed on a phone.
# Run it from the Actions tab: Build Android APK, Run workflow. When it is
# done, open the run and download "sewsmart-apk" under Artifacts.
name: Build Android APK

on:
  # Temporary: builds when this branch is pushed, until the workflow is on develop.
  push:
    branches: [backened]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address built into the app, such as https://api.example.com. Leave empty to set it in the app's login screen instead."
        required: false
        default: ""

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build the APK
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build apk --release --dart-define=API_URL="$API_URL"
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sewsmart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
